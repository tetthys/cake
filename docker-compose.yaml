services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    tty: true
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      # COMPOSER_ROOT_VERSION can be overridden here if you prefer:
      # COMPOSER_ROOT_VERSION: dev-main
    volumes:
      - ./:/app
      - composer-cache:/tmp/composer-cache

volumes:
  composer-cache:
